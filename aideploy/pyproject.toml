[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aideploy"
version = "0.1.0"
description = "Ephemeral AWS deployment CLI for FastAPI portfolio projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "AIDeploy" }]
keywords = ["aws", "fastapi", "deployment", "cli", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "botocore>=1.34",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "docker>=7.1",
]

[project.scripts]
aideploy = "aideploy.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "moto[ecr,apprunner,iam,sts]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-boto3>=1.0",
    "boto3-stubs[ecr,apprunner,iam,sts,logs]>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # do not perform function calls in default arguments (Typer uses this)
    "N818",  # exception names
]

[tool.ruff.lint.isort]
known-first-party = ["aideploy"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "unit: fast unit tests (no AWS, no Docker)",
    "aws: integration tests that require real AWS credentials",
    "docker: integration tests that require Docker",
]

[tool.coverage.run]
source = ["src/aideploy"]
omit = ["tests/*"]
